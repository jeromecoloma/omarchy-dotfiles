
set-option -sa terminal-overrides ",xterm*:Tc"

# make tmux display things in 256 colors
#set -g default-terminal "screen-256color"
set -g default-terminal "tmux-256color"
# set-option -g default-terminal "screen-256color"

# set scrollback history to 30000 (30k)
set -g history-limit 30000

# shorten command delay
set -sg escape-time 0
# set -sg escape-time 10

# set window and pane index to 1 (0 by default)
set-option -g base-index 1
setw -g pane-base-index 1

# reload ~/.tmux.conf using PREFIX r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# use vim keybindings in copy mode
setw -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-selection-and-can

# map Vi movement keys as pane movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# use PREFIX | to split window horizontally and PREFIX - to split vertically
bind | split-window -h

# and use C-h and C-l to cycle thru panes
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# resize panes using PREFIX H, J, K, L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Make selection highlighting obvious in copy-mode
set -g mode-style "bg=colour233,fg=colour255"
set -g message-style "bg=colour238,fg=colour255"

# # Make the selected text even more distinct
# set -g selection-style "bg=colour31,fg=colour255"


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin "tmux-plugins/tmux-yank"

# [Tokyo Night] ::start
set -g @plugin "janoamaral/tokyo-night-tmux"

set -g @tokyo-night-tmux_window_id_style fsquare
set -g @tokyo-night-tmux_pane_id_style super
set -g @tokyo-night-tmux_zoom_id_style dsquare

set -g @tokyo-night-tmux_show_netspeed 0
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_date_format YMD
set -g @tokyo-night-tmux_time_format 12H

# [Tokyo Night] ::end

set -g @tmux_window_name_shells "['bash', 'fish', 'sh', 'zsh']"
set -g @tmux_window_dir_programs "['nvim', 'vim', 'vi', 'git']"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Add emoji before session name (runs after theme loads)
run-shell 'tmux set-option -g status-left " 🔥 $(tmux show-option -gqv status-left)"'

